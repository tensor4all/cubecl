name: publish

# `tag-validation` stays off: the shared publish-crate workflow compares the
# git tag version against `cargo xtask publish`'s idea of the manifest version,
# and the current toolchain reports that as `<name>@<version>`, so the check
# rejects a correct tag ("Git tag version (0.10.1) does not match Cargo.toml
# version (t4a-cubecl-zspace@0.10.1)"). The release tag and the workspace
# version are kept in step by the release commit instead.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run-only:
        description: "Run crate publish jobs in dry-run mode (no publish)"
        type: boolean
        required: false
        default: false

jobs:
  publish-t4a-cubecl-zspace:
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubecl-zspace
      tag-validation: false
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubecl-common:
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubecl-common
      tag-validation: false
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubecl-macros-internal:
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubecl-macros-internal
      tag-validation: false
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubecl-ir:
    needs:
      - publish-t4a-cubecl-common
      - publish-t4a-cubecl-macros-internal
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubecl-ir
      tag-validation: false
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubecl-runtime:
    needs:
      - publish-t4a-cubecl-common
      - publish-t4a-cubecl-ir
      - publish-t4a-cubecl-zspace
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubecl-runtime
      tag-validation: false
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubecl-macros:
    needs:
      - publish-t4a-cubecl-common
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubecl-macros
      tag-validation: false
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubecl-core:
    needs:
      - publish-t4a-cubecl-common
      - publish-t4a-cubecl-ir
      - publish-t4a-cubecl-runtime
      - publish-t4a-cubecl-macros
      - publish-t4a-cubecl-zspace
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubecl-core
      tag-validation: false
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubecl-opt:
    needs:
      - publish-t4a-cubecl-common
      - publish-t4a-cubecl-core
      - publish-t4a-cubecl-ir
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubecl-opt
      tag-validation: false
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubecl-cpp:
    needs:
      - publish-t4a-cubecl-common
      - publish-t4a-cubecl-core
      - publish-t4a-cubecl-opt
      - publish-t4a-cubecl-runtime
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubecl-cpp
      tag-validation: false
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubecl-std:
    needs:
      - publish-t4a-cubecl-common
      - publish-t4a-cubecl-core
      - publish-t4a-cubecl-runtime
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubecl-std
      tag-validation: false
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubecl-wgpu:
    needs:
      - publish-t4a-cubecl-common
      - publish-t4a-cubecl-core
      - publish-t4a-cubecl-cpp
      - publish-t4a-cubecl-ir
      - publish-t4a-cubecl-runtime
      - publish-t4a-cubecl-std
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubecl-wgpu
      tag-validation: false
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubecl-cuda:
    needs:
      - publish-t4a-cubecl-common
      - publish-t4a-cubecl-core
      - publish-t4a-cubecl-cpp
      - publish-t4a-cubecl-runtime
      - publish-t4a-cubecl-std
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubecl-cuda
      tag-validation: false
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubecl:
    needs:
      - publish-t4a-cubecl-core
      - publish-t4a-cubecl-cuda
      - publish-t4a-cubecl-ir
      - publish-t4a-cubecl-runtime
      - publish-t4a-cubecl-std
      - publish-t4a-cubecl-wgpu
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubecl
      tag-validation: false
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
