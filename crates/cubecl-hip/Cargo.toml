[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science"]
description = "AMD ROCm HIP runtime for CubeCL"
edition.workspace = true
keywords = ["gpu", "amd", "rocm", "hip"]
license.workspace = true
name = "cubecl-hip"
publish = false
readme.workspace = true
repository = "https://github.com/tensor4all/cubecl/tree/main/crates/cubecl-hip"
version.workspace = true


[lints]
workspace = true


[features]
default = [
    "std",
    "cubecl-runtime/default",
    "cubecl-common/default",
    "cubecl-core/default",
]

std = ["cubecl-runtime/std", "cubecl-common/std", "cubecl-core/std"]

rocwmma = []

tracing = [
    "dep:tracing",
    "cubecl-runtime/tracing",
    "cubecl-common/tracing",
    "cubecl-core/tracing",
]


[dependencies]
# Runtime Deps
log = { workspace = true }
tracing = { workspace = true, features = ["attributes"], optional = true }

cubecl-common = { package = "t4a-cubecl-common", path = "../cubecl-common", version = "0.10.1", features = [
    "compilation-cache",
    "std",
    "hash",
] }
cubecl-core = { package = "t4a-cubecl-core", path = "../cubecl-core", version = "0.10.1", default-features = false }
cubecl-cpp = { package = "t4a-cubecl-cpp", path = "../cubecl-cpp", version = "0.10.1", default-features = false, features = [
    "hip",
] }
cubecl-hip-sys = { version = "7.1.5280200" }
cubecl-runtime = { package = "t4a-cubecl-runtime", path = "../cubecl-runtime", version = "0.10.1", default-features = false, features = [
    "channel-mutex",
] }

bytemuck = { workspace = true }

derive-new = { workspace = true }
half = { workspace = true }
paste = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
cubecl-core = { package = "t4a-cubecl-core", path = "../cubecl-core", version = "0.10.1", features = [
    "export_tests",
] }
cubecl-std = { package = "t4a-cubecl-std", path = "../cubecl-std", version = "0.10.1", features = [
    "export_tests",
] }
pretty_assertions = { workspace = true }
test-log = { workspace = true, features = ["trace"] }
