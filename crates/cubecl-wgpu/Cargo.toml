[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science"]
description = "Temporary tensor4all fork of CubeCL WGPU runtime"
edition.workspace = true
keywords = ["gpu", "wgpu", "webgpu", "gpgpu"]
license.workspace = true
name = "t4a-cubecl-wgpu"
readme = "README.md"
repository = "https://github.com/tensor4all/cubecl/tree/main/crates/cubecl-wgpu"
version.workspace = true

[lib]
name = "cubecl_wgpu"

[lints]
workspace = true


[features]
default = [
    "cubecl-runtime/default",
    "cubecl-common/default",
    "cubecl-core/default",
]
exclusive-memory-only = ["cubecl-runtime/exclusive-memory-only"]
std = [
    "cubecl-runtime/std",
    "cubecl-common/std",
    "cubecl-core/std",
    "sanitize-filename",
]
msl = ["cubecl-cpp/metal"]
profile-tracy = ["tracy-client"]

vulkan-validate = []

tracing = [
    "dep:tracing",
    "cubecl-runtime/tracing",
    "cubecl-common/tracing",
    "cubecl-core/tracing",
]

[dependencies]
# Runtime Deps
log = { workspace = true }
tracing = { workspace = true, features = ["attributes"], optional = true }

cubecl-common = { package = "t4a-cubecl-common", path = "../cubecl-common", version = "0.10.1", default-features = false }
cubecl-core = { package = "t4a-cubecl-core", path = "../cubecl-core", version = "0.10.1", default-features = false }
cubecl-ir = { package = "t4a-cubecl-ir", path = "../cubecl-ir", version = "0.10.1", default-features = false }
cubecl-runtime = { package = "t4a-cubecl-runtime", path = "../cubecl-runtime", version = "0.10.1", default-features = false, features = [
    "channel-mutex",
] }
derive_more = { workspace = true }
half = { workspace = true }
sanitize-filename = { workspace = true, optional = true }
tracy-client = { workspace = true, optional = true }

# Metal
cubecl-cpp = { package = "t4a-cubecl-cpp", path = "../cubecl-cpp", version = "0.10.1", features = [
    "metal",
], optional = true }

bytemuck = { workspace = true }

async-channel = { workspace = true }
hashbrown = { workspace = true }

cfg-if = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen-futures = { workspace = true }

## wgpu dependency for platforms other than macOS
[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { workspace = true, features = ["fragile-send-sync-non-atomic-wasm"] }
## Uncomment if targeting metal through msl feature
# wgpu = { git = "https://github.com/tracel-ai/wgpu", features = ["fragile-send-sync-non-atomic-wasm"], rev = "624db2ae762b83446693020ae637e2c5879b3af9" }
## For development on wgpu uncomment this one and make it point to your local wgpu repo
# wgpu = { path = "../../../../tracel/wgpu/wgpu", features = ["fragile-send-sync-non-atomic-wasm"]}
## On macOS, the `vulkan-portability` feature is required due to the MoltenVK translation layer.
# To install MoltenVK, install the VulkanSDK: https://vulkan.lunarg.com/sdk/home#mac
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = [
    "vulkan-portability",
    "fragile-send-sync-non-atomic-wasm",
] }
## Uncomment if targeting metal through msl feature
# wgpu = { git = "https://github.com/tracel-ai/wgpu", features = ["vulkan-portability", "fragile-send-sync-non-atomic-wasm"], rev = "624db2ae762b83446693020ae637e2c5879b3af9" }
## For development on wgpu uncomment this one and make it point to your local wgpu repo
# wgpu = { path = "../../../../tracel/wgpu/wgpu", features = ["vulkan-portability", "fragile-send-sync-non-atomic-wasm"]}

[dev-dependencies]
cubecl-core = { package = "t4a-cubecl-core", path = "../cubecl-core", version = "0.10.1", features = [
    "export_tests",
] }
cubecl-std = { package = "t4a-cubecl-std", path = "../cubecl-std", version = "0.10.1", features = [
    "export_tests",
] }
half = { workspace = true }
paste = { workspace = true }
pretty_assertions = { workspace = true }
test-log = { workspace = true, features = ["trace"] }

[build-dependencies]
cfg_aliases = "0.2.1"
